x-logging-config: &default-logging
  driver: 'json-file'
  options:
    max-size: '100m'
    max-file: '5'
    compress: 'true'

x-rails-config: &default-rails-config
  build:
    args:
      - GIT_REV=${GIT_REV:-}
      - RAILS_ENV=${RAILS_ENV:-}
      - RUBY_VERSION=${RUBY_VERSION:-}
      - CONTENT_SIGNING_PUBLIC_KEY=${CONTENT_SIGNING_PUBLIC_KEY:-}
    context: .
  depends_on:
    initialize_database:
      condition: service_completed_successfully
  develop:
    watch:
      - action: sync
        path: .
        target: /app
  env_file:
    # NOTE: We need this to have DATABASE_URL in bin/docker-entrypoint.
    - .env.production.local
  environment:
    # CAUTION: `web` overrides all env vars listed here with its own `environment` section.
    RAILS_MAX_THREADS: 1
  logging: *default-logging
  networks:
    - external
    - internal

x-redis-config: &redis
  depends_on:
    redis-overcommit:
      condition: service_started
    vector:
      condition: service_started
  healthcheck:
    test: ['CMD', 'redis-cli', 'ping']
    start_period: 20s
    start_interval: 1s
    interval: 5m
    timeout: 1s
    retries: 1
  image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
  logging: *default-logging
  networks:
    - internal

services:
  cadvisor:
    command:
      # Add options to lower CPU/memory use. https://github.com/google/cadvisor/issues/2523
      - '--docker_only'
      - '--docker=tcp://docker-socket-proxy:2375'
      - '--housekeeping_interval=30s'
      - '--enable_metrics'
      - 'cpu,diskIO,memory,network'
    cpu_shares: 512
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    expose:
      - '8080'
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    networks:
      - docker-socket-proxy
      - internal
    volumes:
      - /sys:/sys:ro # Seems to be needed for CPU and Disk I/O usage.
      - /var/lib/docker/:/var/lib/docker:ro # Seems to be needed for memory usage.
  certbot:
    cpu_shares: 256
    depends_on:
      vector:
        condition: service_started
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    healthcheck:
      test: certbot --version
      start_period: 30s
      start_interval: 5s
      interval: 1h
      timeout: 10s
      retries: 1
    image: certbot/certbot:v3.3.0@sha256:632f197de473512f77f60cbea4b5a80ed42b5e9bb6f9e103c997d73549711ebb
    logging: *default-logging
    networks:
      - external
    volumes:
      - ./ssl-data/certbot/conf:/etc/letsencrypt
      - ./ssl-data/certbot/www:/var/www/_letsencrypt
  clock:
    <<: *default-rails-config
    command: ['bin/skedjewel']
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          memory: 99G
        reservations:
          memory: 6M
    healthcheck:
      test: ps -eo cmd | grep -P '^[b]in/skedjewel$'
      start_period: 10s
      start_interval: 2s
      interval: 5m
      timeout: 1s
      retries: 1
    memswap_limit: 99G
  docker-socket-proxy:
    cpu_shares: 256
    environment:
      CONTAINERS: '1'
      EVENTS: '1'
      INFO: '1'
      PING: '1'
      POST: '0' # Allow only GET and HEAD requests.
      VERSION: '1'
    expose:
      - '2375'
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '--quiet', 'http://localhost:2375/_ping']
      start_period: 10s
      start_interval: 1s
      interval: 5m
      timeout: 1s
      retries: 1
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    networks:
      - docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  grafana:
    cpu_shares: 512
    depends_on:
      - loki
      - prometheus
    env_file:
      - .env.grafana.local
    expose:
      - '3000'
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    networks:
      - external # Allows Grafana to download plugins.
      - internal
    volumes:
      - grafana-data:/var/lib/grafana
  initialize_database:
    <<: *default-rails-config
    cpu_shares: 256
    depends_on:
      postgres:
        condition: service_healthy
      redis-app:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      vector:
        condition: service_started
  loki:
    cpu_shares: 512
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -log.level=warn
    expose:
      - '3100'
    logging: *default-logging
    networks:
      - internal
    volumes:
      - loki-data:/loki
  nginx:
    cpu_shares: 4096
    depends_on:
      vector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 99G
        reservations:
          memory: 10M
    entrypoint: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & /docker-entrypoint.sh nginx -g "daemon off;"'''
    env_file:
      - .env.nginx.local
    healthcheck:
      test: |-
        curl -s -o /dev/null -w "%{http_code}" --header 'Host: davidrunger.com' http://localhost/nginx-health | grep -q "^200$" || false
      start_period: 60s
      start_interval: 2s
      interval: 5m
      timeout: 3s
      retries: 1
    image: nginx:1.31.5-alpine@sha256:34f40471dea485273c5e2a04dd5e97a682332ceb4a9adecd67de450dcb2fb390
    logging: *default-logging
    memswap_limit: 99G
    networks:
      - external
      - internal
    ports:
      - 80:80
      - 443:443
    profiles:
      - nondefault
    volumes:
      - ./config/nginx/:/etc/nginx/
      - ./ssl-data/certbot/conf:/etc/letsencrypt
      - ./ssl-data/certbot/www:/var/www/_letsencrypt
      - app-public:/var/www/david-runger-public:ro
  node_exporter:
    cpu_shares: 512
    expose:
      - '9100'
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    networks:
      - internal
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_activity_query_size=2048
    cpu_shares: 2048
    depends_on:
      vector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 99G
        reservations:
          memory: 50M
    env_file:
      - .env.postgres.local
    environment:
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
      POSTGRES_USER: david_runger
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'david_runger']
      start_period: 20s
      start_interval: 1s
      interval: 5m
      timeout: 1s
      retries: 1
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    logging: *default-logging
    memswap_limit: 99G
    networks:
      - internal
    volumes:
      - postgres-data-v18:/var/lib/postgresql
  prometheus:
    cpu_shares: 512
    expose:
      - '9090'
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    networks:
      - internal
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
  rails_metrics:
    <<: *default-rails-config
    cpu_shares: 512
    entrypoint: bin/prometheus_exporter --bind 0.0.0.0
    expose:
      - '9394'
    networks:
      - internal
  redis-app:
    <<: *redis
    # https://stackoverflow.com/a/72593084/4009384
    command:
      - /bin/sh
      - -c
      # - Double dollars, so that the variable is not expanded by Docker Compose
      # - Surround by quotes, so that the shell does not split the password
      # - The ${variable:?message} syntax causes shell to exit with a non-zero
      #   code and print a message, when the variable is not set or empty
      - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    cpu_shares: 2048
    deploy:
      resources:
        limits:
          memory: 99G
        reservations:
          memory: 12M
    env_file:
      - .env.redis-app.local
    memswap_limit: 99G
    volumes:
      - redis:/data
  redis-cache:
    <<: *redis
    # https://stackoverflow.com/a/72593084/4009384
    command:
      - /bin/sh
      - -c
      # - Double dollars, so that the variable is not expanded by Docker Compose
      # - Surround by quotes, so that the shell does not split the password
      # - The ${variable:?message} syntax causes shell to exit with a non-zero
      #   code and print a message, when the variable is not set or empty
      - redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    cpu_shares: 2048
    deploy:
      resources:
        limits:
          memory: 99G
        reservations:
          memory: 6M
    env_file:
      - .env.redis-cache.local
    memswap_limit: 99G
    volumes:
      - ./redis/redis-cache.conf:/usr/local/etc/redis/redis.conf
  redis-overcommit:
    build: ./docker/redis-overcommit
    cpu_shares: 256
    restart: 'no'
    volumes:
      - /proc/sys/vm:/mnt/vm
  s3_db_backup:
    cpu_shares: 256
    depends_on:
      vector:
        condition: service_started
    env_file:
      - .env.s3_db_backup.local
    image: dokku/s3backup:0.18.2@sha256:a781df6117de0ecfebdc2d67643a576ebea84c0bdddf9bd8686e515e05cde649
    logging: *default-logging
    networks:
      - external
    profiles:
      - nondefault
  vector:
    command:
      - '--config'
      - '/etc/vector/vector.yaml'
      - '--require-healthy'
      - 'true'
      - '--watch-config'
    cpu_shares: 512
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    image: timberio/vector:0.58.0-alpine@sha256:5dcf67db0ee378caa87f3395cb9484ebe3e97bb0334d119f2ac33116e00c5773
    networks:
      - docker-socket-proxy
      - internal
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
  web:
    <<: *default-rails-config
    command: ['bin/rails', 'server', '--binding', '0.0.0.0']
    cpu_shares: 4096
    deploy:
      resources:
        limits:
          memory: 99G
        reservations:
          memory: 230M
    environment:
      RAILS_MAX_THREADS: 2
    expose:
      - '3000'
    healthcheck:
      test: curl --silent --output /dev/null --fail localhost:3000/up
      start_period: 60s
      start_interval: 2s
      interval: 5m
      timeout: 5s
      retries: 1
    memswap_limit: 99G
    profiles:
      - nondefault
    volumes:
      - ./blog:/app/blog:ro
  worker:
    <<: *default-rails-config
    command: ['bin/sidekiq']
    cpu_shares: 1024
    deploy:
      resources:
        reservations:
          memory: 36M
    healthcheck:
      test: REDIS_URL="$$REDIS_URL/1" bin/sidekiqmon | grep --quiet "$$(hostname)"
      start_period: 60s
      start_interval: 10s
      interval: 5m
      timeout: 10s
      retries: 1

networks:
  docker-socket-proxy:
    driver: bridge
    internal: true
  external:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  app-public:
  grafana-data:
  loki-data:
  postgres-data-v18:
  prometheus-data:
  redis:
