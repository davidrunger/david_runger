name: Test (& Deploy)

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    concurrency:
      cancel-in-progress: true
      group: test-${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432
      redis:
        image: redis:8.4.0-alpine
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 6379:6379
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 10 # this might cause issues if there are more than 10 commits in a PR (?)

      - parallel:
          - name: Configure Postgres for speed over reliability
            run: |
              psql -c "ALTER SYSTEM SET fsync=off;"
              psql -c "ALTER SYSTEM SET full_page_writes=off;"
              psql -c "ALTER SYSTEM SET synchronous_commit=off;"
              psql -c "SELECT pg_reload_conf();"
            env:
              PGHOST: 127.0.0.1
              PGUSER: postgres
              PGPASSWORD: postgres

          - name: Set GIT_REV environment variable
            uses: ./.github/actions/git_rev

          - name: Set PERCY_BROWSER_EXECUTABLE env var to system Chrome browser
            run: |
              CHROME_PATH=$(which google-chrome)
              echo "PERCY_BROWSER_EXECUTABLE=$CHROME_PATH" >> $GITHUB_ENV

          - name: Set up Ruby
            uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
            with:
              bundler-cache: true

          - name: Set up Node
            uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
            with:
              node-version-file: .node-version

      - name: Print context info
        run: |
          echo "Branch: ${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          pr=${GITHUB_REF#refs/pull/}
          echo "PR: #${pr%/merge}"
          echo "SHA: $GIT_REV"

      - name: Install pnpm
        run: npm install -g pnpm@11.21.0

      - name: Set pnpm store directory
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - parallel:
          - name: Restore pnpm cache
            id: pnpm-cache
            uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: ${{ env.PNPM_STORE_PATH }}
              key: ${{ runner.os }}-pnpm-store-v3-${{ hashFiles('**/pnpm-lock.yaml') }}
              restore-keys: ${{ runner.os }}-pnpm-store-v3-

          - name: Restore RuboCop cache
            uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: tmp/rubocop_cache
              key: ${{ runner.os }}-rubocop-v1-${{ github.sha }}
              restore-keys: ${{ runner.os }}-rubocop-v1-

          - name: Run ShellCheck
            uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
            with:
              scandir: './bin'

      - name: Ensure clean git status
        run: '! [[ -n $(git status --porcelain) ]] || (git status && false)'

      - name: Run tests & linters
        run: bin/run-tests
        env:
          CI: true
          PALLETS_CONCURRENCY: 6
          AWS_EC2_METADATA_DISABLED: true
          RAILS_ENV: test
          DISABLE_SPRING: 1
          PERCY_SKIP_UPDATE_CHECK: 1
          VITE_RUBY_AUTO_BUILD: false
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_USER: postgres
          PGPASSWORD: postgres
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          REDIS_HOST: redis
          REDIS_PORT: 6379
          AWS_ACCESS_KEY_ID: '${{secrets.AWS_ACCESS_KEY_ID}}'
          AWS_SECRET_ACCESS_KEY: '${{secrets.AWS_SECRET_ACCESS_KEY}}'
          CONTENT_SIGNING_PRIVATE_KEY: '${{secrets.CONTENT_SIGNING_PRIVATE_KEY}}'
          CI_STEP_RESULTS_HOST: '${{secrets.CI_STEP_RESULTS_HOST}}'
          CI_STEP_RESULTS_AUTH_TOKEN: '${{secrets.CI_STEP_RESULTS_AUTH_TOKEN}}'
          PERCY_TOKEN: '${{secrets.PERCY_TOKEN}}'
          CODECOV_TOKEN: '${{secrets.CODECOV_TOKEN}}'

      - parallel:
          - name: Save feature spec artifacts
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            if: failure()
            with:
              name: feature_spec_artifacts
              path: |
                log/failed_feature_specs/
                tmp/failure_screenshots/
                tmp/feature_specs_a.txt
                tmp/feature_specs_b.txt
                tmp/feature_specs_c.txt
              retention-days: 5

          - name: Save fixtures artifact
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            if: failure()
            with:
              name: fixtures
              path: spec/fixtures/
              retention-days: 5

          - name: Verify Ruby base image digest if needed
            if: ${{ !cancelled() }}
            run: bin/check-ruby-image-digest-if-needed

          - name: Upload Code Coverage
            uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
            if: ${{ !cancelled() }}
            with:
              token: ${{ secrets.CODECOV_TOKEN }}

          - name: Stop Percy
            if: ${{ !cancelled() }}
            run: ./node_modules/.bin/percy exec:stop
            env:
              PERCY_TOKEN: '${{secrets.PERCY_TOKEN}}'

          - name: Prune pnpm store
            if: ${{ !cancelled() && steps.pnpm-cache.outputs.cache-hit != 'true' }}
            run: pnpm store prune

          - name: Check code coverage
            if: ${{ !cancelled() }}
            uses: davidrunger/check-ruby-coverage@d4a24ec6ee57cb7d202bb14a29e7f60dfe43be23 # v1.0.0

      - name: Save pnpm cache
        if: ${{ !cancelled() && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v3-${{ hashFiles('**/pnpm-lock.yaml') }}

  warm-rubocop-cache:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    concurrency:
      group: warm-rubocop-cache
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Restore RuboCop cache
        id: rubocop-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/rubocop_cache
          key: ${{ runner.os }}-rubocop-v1-${{ github.sha }}
          restore-keys: ${{ runner.os }}-rubocop-v1-

      - name: Warm RuboCop cache
        run: bin/rubocop $(git ls-files) --color --format clang --force-exclusion

      - name: Save RuboCop cache
        if: ${{ success() && steps.rubocop-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/rubocop_cache
          key: ${{ runner.os }}-rubocop-v1-${{ github.sha }}

  deploy-and-prerender:
    concurrency:
      group: deploy-and-prerender
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up key for SSHing to server
        run: |
          mkdir -p ~/.ssh/
          echo "${{secrets.SSH_KNOWN_HOSTS}}" > ~/.ssh/known_hosts
          echo "${{secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/id_ed25519
          echo "${{secrets.SSH_PUBLIC_KEY}}" > ~/.ssh/id_ed25519.pub
          sudo chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Set GIT_REV environment variable
        uses: ./.github/actions/git_rev

      - name: Copy deploy script to server and execute it
        run: |
          scp bin/server/deploy.sh "${{secrets.SERVER_USER_AND_IP}}:/tmp/"
          ssh "${{secrets.SERVER_USER_AND_IP}}" \
            "GIT_REV='$GIT_REV' bash /tmp/deploy.sh && rm /tmp/deploy.sh"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Prerender page(s) and upload them to S3
        run: bin/prerender
        env:
          CI: true
          AWS_ACCESS_KEY_ID: '${{secrets.AWS_ACCESS_KEY_ID}}'
          AWS_SECRET_ACCESS_KEY: '${{secrets.AWS_SECRET_ACCESS_KEY}}'
          CONTENT_SIGNING_PRIVATE_KEY: '${{secrets.CONTENT_SIGNING_PRIVATE_KEY}}'
