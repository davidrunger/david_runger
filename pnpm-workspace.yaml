minimumReleaseAge: 7200 # Wait 5 days before installing new releases.
strictDepBuilds: true
allowBuilds:
  '@percy/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  '@parcel/watcher': false
  protobufjs: false
overrides:
  typescript: ^6
minimumReleaseAgeExclude:
  - stylelint@18.0.0
  - stylelint-config-standard@41.0.0
  - stylelint-config-recommended@19.0.0
