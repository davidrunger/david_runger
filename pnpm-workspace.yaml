minimumReleaseAge: 7200 # Wait 5 days before installing new releases.
strictDepBuilds: true
allowBuilds:
  '@percy/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  '@parcel/watcher': false
  protobufjs: false
overrides:
  typescript: ^6
minimumReleaseAgeExclude:
  - minimatch@11.0.1
  - glob@14.0.2
