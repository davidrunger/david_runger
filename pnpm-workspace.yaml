minimumReleaseAge: 7200 # Wait 5 days before installing new releases.
strictDepBuilds: true
allowBuilds:
  '@percy/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  '@parcel/watcher': false
  protobufjs: false
overrides:
  typescript: ^6
minimumReleaseAgeExclude:
  - picomatch@4.0.7
  - vite-plugin-ruby@5.2.3
