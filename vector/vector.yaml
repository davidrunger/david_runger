sources:
  docker:
    type: docker_logs
    docker_host: http://docker-socket-proxy:2375

transforms:
  docker_with_grafana_nginx_separated:
    type: remap
    inputs:
      - docker
    source: |
      if .label."com.docker.compose.service" == "nginx" && contains(string!(.message), " subdomain=grafana ") {
        .label."com.docker.compose.service" = "nginx-grafana"
      }

sinks:
  loki:
    type: loki
    inputs:
      - docker_with_grafana_nginx_separated
    # This template sets a Loki label value from Docker's Compose metadata; it
    # does not select a path, URL, or object key that confinement could protect.
    dangerously_allow_unconfined_template_resolution: true
    endpoint: http://loki:3100
    encoding:
      codec: text
    healthcheck:
      enabled: false
    labels:
      service_name: '{{ .label."com.docker.compose.service" }}'
    structured_metadata:
      container_id: '{{ .container_id }}'
      container_name: '{{ .container_name }}'
      oneoff: '{{ .label."com.docker.compose.oneoff" }}'
